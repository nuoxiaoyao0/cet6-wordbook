<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>六级词汇 · 书页模式</title>
<meta name="description" content="像纸质单词书一样：单词在上、中文在下，一屏一整页，从不遮住释义。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="六级词汇">
<meta name="theme-color" content="#f4ebdc">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>

<div class="app" id="app" data-theme="paper" data-view="all">

  <header class="topbar">
    <button class="icon-btn" id="btnToc" aria-label="目录与视图">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <button class="title" id="btnTitle" aria-label="打开目录">
      <span class="t-main" id="bookTitle">六级词汇</span>
      <span class="t-sub" id="subTitle">书页模式</span>
    </button>
    <div class="tb-right">
      <button class="icon-btn" id="btnSearch" aria-label="搜索">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" aria-label="设置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h10M18 17h2"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="16" cy="17" r="2"/></svg>
      </button>
    </div>
    <div class="progress-rail" id="progressRail"><i></i></div>
  </header>

  <div class="searchbar" id="searchbar" hidden>
    <svg class="sb-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input id="searchInput" type="search" placeholder="搜单词或中文释义" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <button class="text-btn" id="btnSearchClear" hidden>清除</button>
    <button class="text-btn" id="btnSearchClose">取消</button>
  </div>

  <main class="paper" id="paper">
    <div class="running" id="running">
      <span id="runLeft">CET-6</span>
      <span id="runRight"></span>
    </div>
    <div class="flow" id="flow" aria-live="polite"></div>
    <div class="pagenum" id="pagenum">—</div>
  </main>

  <nav class="navbar">
    <button class="nav-btn" id="btnPrev" aria-label="上一页"><span aria-hidden="true">‹</span> 上一页</button>
    <div class="nav-info">
      <b id="pageInfo">1 / 1</b>
      <span id="wordRange"></span>
    </div>
    <button class="nav-btn" id="btnNext" aria-label="下一页">下一页 <span aria-hidden="true">›</span></button>
  </nav>

  <div class="loading" id="loading">
    <div class="ld-book" aria-hidden="true"><span></span><span></span></div>
    <p class="ld-text">正在装订单词书…</p>
    <div class="ld-track"><i id="ldBar"></i></div>
    <p class="ld-hint" id="ldHint"></p>
  </div>
</div>

<!-- ───────── 目录 / 视图 ───────── -->
<section class="sheet" id="sheetToc" hidden aria-label="目录">
  <div class="sheet-bg" data-close></div>
  <div class="sheet-panel">
    <div class="sheet-grip" data-close></div>
    <header class="sheet-head">
      <h2>目录</h2>
      <button class="text-btn" data-close>完成</button>
    </header>
    <div class="sheet-body">
      <div class="chips" id="viewChips"></div>
      <div class="alpha" id="alphaIndex"></div>
      <div class="toc" id="tocList"></div>
    </div>
  </div>
</section>

<!-- ───────── 设置 ───────── -->
<section class="sheet" id="sheetSet" hidden aria-label="设置">
  <div class="sheet-bg" data-close></div>
  <div class="sheet-panel">
    <div class="sheet-grip" data-close></div>
    <header class="sheet-head">
      <h2>设置</h2>
      <button class="text-btn" data-close>完成</button>
    </header>
    <div class="sheet-body">

      <div class="set-row">
        <label class="set-label">主题</label>
        <div class="seg" id="segTheme">
          <button data-v="paper">纸书</button>
          <button data-v="clean">清爽</button>
          <button data-v="night">夜间</button>
        </div>
      </div>

      <div class="set-row">
        <label class="set-label" for="rngSize">字号 <b id="lblSize">17</b></label>
        <input class="rng" id="rngSize" type="range" min="14" max="26" step="1">
      </div>

      <div class="set-row col">
        <label class="set-label">每页排列</label>
        <div class="seg" id="segPerPage">
          <button data-v="0">填满整页</button>
          <button data-v="10">10 词</button>
          <button data-v="15">15 词</button>
          <button data-v="20">20 词</button>
          <button data-v="30">30 词</button>
        </div>
        <p class="set-note">「填满整页」按屏幕高度自动折算，一页正好一屏，不用滚动。</p>
      </div>

      <div class="set-row">
        <label class="set-label" for="tgSent">显示例句（英文＋中文）</label>
        <button class="switch" id="tgSent" role="switch" aria-checked="true"><i></i></button>
      </div>

      <div class="set-row">
        <label class="set-label" for="tgPhon">显示音标</label>
        <button class="switch" id="tgPhon" role="switch" aria-checked="true"><i></i></button>
      </div>

      <div class="set-row">
        <label class="set-label" for="tgHide">「全部」中跳过已掌握</label>
        <button class="switch" id="tgHide" role="switch" aria-checked="false"><i></i></button>
      </div>

      <div class="set-row">
        <label class="set-label">词序</label>
        <div class="seg" id="segOrder">
          <button data-v="alpha">字母序</button>
          <button data-v="shuffle">乱序</button>
          <button data-v="reshuffle" class="mini">重新打乱</button>
        </div>
      </div>

      <div class="set-row">
        <label class="set-label">发音口音</label>
        <div class="seg" id="segAccent">
          <button data-v="us">美音</button>
          <button data-v="uk">英音</button>
        </div>
      </div>

      <div class="set-row col">
        <label class="set-label">数据</label>
        <div class="btn-row">
          <button class="btn" id="btnExportMark">导出标记单词（CSV）</button>
          <button class="btn" id="btnExportAll">导出全部单词（CSV）</button>
        </div>
        <div class="btn-row">
          <button class="btn" id="btnPrint">打印当前书页</button>
          <button class="btn danger" id="btnReset">清空全部标记</button>
        </div>
        <p class="set-note" id="statNote">—</p>
      </div>

      <div class="set-row col">
        <label class="set-label">用法</label>
        <p class="set-note">
          轻点释义 → 展开例句与词根；轻点单词 → 发音；长按词条 → 详情。
          词条右侧的圆点按 <b>○ → ✓ → △ → ✕</b> 循环标记。左右滑动或按 ← → 翻页。
        </p>
        <p class="set-note">版本 <span id="verText">1.0.0</span> · 词量 <span id="countText">—</span></p>
      </div>
    </div>
  </div>
</section>

<!-- ───────── 词条详情 ───────── -->
<section class="sheet" id="sheetDetail" hidden aria-label="词条详情">
  <div class="sheet-bg" data-close></div>
  <div class="sheet-panel tall">
    <div class="sheet-grip" data-close></div>
    <div class="sheet-body detail" id="detailBody"></div>
  </div>
</section>

<div class="toast" id="toast" hidden></div>

<script src="./assets/app.js"></script>
</body>
</html>
